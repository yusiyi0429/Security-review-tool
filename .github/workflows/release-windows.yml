name: Release Windows

run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from the repository VERSION file
        required: true
        type: string
      validation_only:
        description: Run release gates without building or publishing assets
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Validate requested version
        shell: pwsh
        run: |
          $repositoryVersion = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($repositoryVersion -ne '${{ inputs.version }}') {
            throw "Requested version '${{ inputs.version }}' does not match VERSION '$repositoryVersion'."
          }
          $notes = ".github/release-notes/v$repositoryVersion.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Release notes not found: $notes"
          }

      - name: Run unit, contract, and parser corpus lanes
        shell: pwsh
        run: |
          ./build/test.ps1 `
            -Lane Unit,Contract,ParserCorpus `
            -RequireCorpus

      - name: Run focused integration regressions
        shell: pwsh
        run: |
          dotnet test tests/SecurityReview.IntegrationTests/SecurityReview.IntegrationTests.csproj `
            -c Release `
            -r win-x64 `
            --no-restore `
            --filter "FullyQualifiedName~MigrationTests|FullyQualifiedName~CompositionRootTests|FullyQualifiedName~CompleteScanWorkflowTests|FullyQualifiedName~SemanticFailureWorkflowTests|FullyQualifiedName~SemanticReviewQueueTests|FullyQualifiedName~SqliteMaintenanceServiceTests|FullyQualifiedName~LlmConfigurationStoreTests|FullyQualifiedName~LlmLogRedactionTests|FullyQualifiedName~RulePackImportTests" `
            --logger "trx;LogFileName=FocusedIntegration.trx"
          if ($LASTEXITCODE -ne 0) {
            throw "Focused integration regressions failed."
          }

      - name: Verify requirements traceability
        shell: pwsh
        run: ./build/verify-traceability.ps1

      - name: Verify code graph is current
        shell: pwsh
        run: ./build/update-code-graph.ps1 -Check

      - name: Publish worker variants for Windows security tests
        shell: pwsh
        run: |
          function Publish-Worker {
            param(
              [Parameter(Mandatory = $true)]
              [string] $OutputDirectory,
              [switch] $IncludeFaultProbes
            )

            $publishArgs = @(
              "-c", "Release",
              "-r", "win-x64",
              "--self-contained", "true"
            )
            if ($IncludeFaultProbes) {
              $publishArgs += "-p:SecurityReviewSandboxProbe=true"
            }

            dotnet publish src/SecurityReview.Worker/SecurityReview.Worker.csproj `
              @publishArgs -o $OutputDirectory
            if ($LASTEXITCODE -ne 0) {
              throw "Worker publish failed."
            }

            $files = [ordered]@{}
            Get-ChildItem -LiteralPath $OutputDirectory -File |
              Where-Object { $_.Name -ne "worker-manifest.json" } |
              Sort-Object -Property Name |
              ForEach-Object {
                $files[$_.Name] = (
                  Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
                ).Hash.ToLowerInvariant()
              }
            $manifest = [ordered]@{
              algorithm = "SHA256"
              files = $files
            }
            [System.IO.File]::WriteAllText(
              (Join-Path $OutputDirectory "worker-manifest.json"),
              ($manifest | ConvertTo-Json -Depth 4),
              [System.Text.UTF8Encoding]::new($false))
          }

          $probeDir = Join-Path $PWD "artifacts/windows-security/WorkerProbe"
          $productionDir = Join-Path $PWD "artifacts/windows-security/WorkerProduction"
          Publish-Worker -OutputDirectory $probeDir -IncludeFaultProbes
          Publish-Worker -OutputDirectory $productionDir

      - name: Run Windows security lane
        shell: pwsh
        env:
          SECURITY_REVIEW_RUN_WINDOWS_SECURITY: "1"
          SECURITY_REVIEW_PROBE_WORKER_DIR: ${{ github.workspace }}\artifacts\windows-security\WorkerProbe
          SECURITY_REVIEW_PRODUCTION_WORKER_DIR: ${{ github.workspace }}\artifacts\windows-security\WorkerProduction
        run: ./build/test.ps1 -Lane WindowsSecurity -RequireWindowsSecurity

      - name: Install Inno Setup
        if: ${{ !inputs.validation_only }}
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build and verify portable package
        if: ${{ !inputs.validation_only }}
        shell: pwsh
        run: ./build/package.ps1 -Version '${{ inputs.version }}' -AllowUnsignedPilot

      - name: Build and verify installer
        if: ${{ !inputs.validation_only }}
        shell: pwsh
        run: |
          ./build/package-installer.ps1 `
            -Version '${{ inputs.version }}' `
            -PortablePackage "artifacts/release/SecurityReviewTool-${{ inputs.version }}-win-x64.zip" `
            -AllowUnsignedPilot

      - name: Preserve release assets as workflow artifact
        if: ${{ !inputs.validation_only }}
        uses: actions/upload-artifact@v4
        with:
          name: SecurityReviewTool-${{ inputs.version }}-win-x64
          if-no-files-found: error
          path: |
            artifacts/release/SecurityReviewTool-${{ inputs.version }}-win-x64.zip
            artifacts/release/SecurityReviewTool-${{ inputs.version }}-win-x64.zip.sha256
            artifacts/release/SecurityReviewTool-${{ inputs.version }}-win-x64-setup.exe
            artifacts/release/SecurityReviewTool-${{ inputs.version }}-win-x64-setup.exe.sha256

      - name: Create GitHub release
        if: ${{ !inputs.validation_only }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ inputs.version }}'
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists; published assets are never overwritten."
          }

          $assets = @(
            "artifacts/release/SecurityReviewTool-$version-win-x64.zip",
            "artifacts/release/SecurityReviewTool-$version-win-x64.zip.sha256",
            "artifacts/release/SecurityReviewTool-$version-win-x64-setup.exe",
            "artifacts/release/SecurityReviewTool-$version-win-x64-setup.exe.sha256"
          )
          gh release create $tag $assets `
            --target $env:GITHUB_SHA `
            --title $tag `
            --notes-file ".github/release-notes/$tag.md" `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed."
          }
